name: CI / Build Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (e.g. all, green, red, red11, green11)'
        required: false
        default: 'all'
      compare:
        description: 'Verify SHA1 hashes against roms.sha1'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ROMs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & RGBDS
        run: |
          set -e
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends libpng-dev make gcc wget xz-utils

          RGBDS_VER="$(cat .rgbds-version 2>/dev/null | tr -d '[:space:]')"
          if [ -z "$RGBDS_VER" ]; then
            RGBDS_VER="1.0.3"
          fi
          echo "Target RGBDS version: v${RGBDS_VER}"

          URL="https://github.com/gbdev/rgbds/releases/download/v${RGBDS_VER}/rgbds-linux-x86_64.tar.xz"
          if wget -q --spider "$URL"; then
            echo "Downloading prebuilt RGBDS from $URL..."
            mkdir -p /tmp/rgbds
            wget -qO- "$URL" | tar -xJ -C /tmp/rgbds
            INSTALL_SH=$(find /tmp/rgbds -name install.sh 2>/dev/null | head -n 1)
            if [ -n "$INSTALL_SH" ]; then
              INSTALL_DIR=$(dirname "$INSTALL_SH")
              echo "Running install.sh from $INSTALL_DIR..."
              (cd "$INSTALL_DIR" && sudo ./install.sh)
            else
              find /tmp/rgbds -type f \( -name rgbasm -o -name rgblink -o -name rgbfix -o -name rgbgfx \) -exec sudo cp {} /usr/local/bin/ \;
            fi
            sudo chmod +x /usr/local/bin/rgb* 2>/dev/null || true
          else
            echo "Prebuilt binary not found. Compiling RGBDS v${RGBDS_VER} from source..."
            sudo apt-get install -yq bison pkg-config
            git clone --depth 1 --branch "v${RGBDS_VER}" https://github.com/gbdev/rgbds.git /tmp/rgbds-src
            sudo make -C /tmp/rgbds-src -j$(nproc) install
            rm -rf /tmp/rgbds-src
          fi

      - name: Verify RGBDS installation
        run: |
          rgbasm --version
          rgblink --version
          rgbfix --version
          rgbgfx --version

      - name: Build ROMs and Patches
        run: |
          TARGET="${{ github.event.inputs.target || 'all' }}"
          echo "==> Building target: $TARGET"
          make -j$(nproc) $TARGET
          if [ "$TARGET" = "all" ]; then
            make -j$(nproc) red11_vc green11_vc || true
          fi

      - name: Check for uncommitted changes
        run: |
          chmod +x .github/checkdiff.sh
          .github/checkdiff.sh

      - name: Verify ROM checksums (optional)
        if: ${{ github.event.inputs.compare == true }}
        run: |
          make DEBUG=1 compare

      - name: Generate Checksums & Step Summary
        run: |
          echo "### Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | SHA1 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          for f in *.gb *.patch; do
            if [ -f "$f" ]; then
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              SHA=$(sha1sum "$f" | awk '{print $1}')
              echo "| \`$f\` | $SIZE | \`$SHA\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          sha1sum *.gb *.patch > checksums.sha1 2>/dev/null || true

      - name: Upload ROMs and Patches
        uses: actions/upload-artifact@v4
        with:
          name: pokegreen-roms
          path: |
            *.gb
            *.patch
            checksums.sha1
          if-no-files-found: error

      - name: Upload Debug Symbols & Maps
        uses: actions/upload-artifact@v4
        with:
          name: pokegreen-symbols
          path: |
            *.sym
            *.map
          if-no-files-found: warn

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ROMs and Patches
        uses: actions/download-artifact@v4
        with:
          name: pokegreen-roms
          path: release-assets

      - name: Download Symbols & Maps
        uses: actions/download-artifact@v4
        with:
          name: pokegreen-symbols
          path: release-assets/symbols

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.gb
            release-assets/*.patch
            release-assets/checksums.sha1
            release-assets/symbols/*
          generate_release_notes: true
